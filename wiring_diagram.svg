<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 700" width="1020" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="2"/>
      <line x1="-10" y1="8" x2="10" y2="8" stroke="#222" stroke-width="2"/>
      <line x1="-6" y1="12" x2="6" y2="12" stroke="#222" stroke-width="2"/>
      <line x1="-2" y1="16" x2="2" y2="16" stroke="#222" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1020" height="700" fill="#ffffff"/>
  <text x="510" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Smart Plant Watering System — Wiring Diagram</text>

  <!-- ===== ESP32 ===== -->
  <rect x="40" y="80" width="200" height="520" rx="10" fill="#1e3a5f"/>
  <text x="140" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">ESP32 DevKit</text>
  <text x="140" y="585" text-anchor="middle" font-size="12" fill="#cfe0f5">powered via USB</text>
  <g font-size="13" fill="#fff" text-anchor="end">
    <text x="230" y="124">3V3</text>
    <text x="230" y="164">GND</text>
    <text x="230" y="224">GPIO32 (ADC1)</text>
    <text x="230" y="289">GPIO4</text>
    <text x="230" y="374">GPIO21 (SDA)</text>
    <text x="230" y="394">GPIO22 (SCL)</text>
    <text x="230" y="474">GPIO13</text>
    <text x="230" y="554">GPIO25</text>
  </g>

  <!-- ===== Power rails ===== -->
  <line x1="240" y1="120" x2="300" y2="120" stroke="#d62828" stroke-width="3"/>
  <line x1="300" y1="120" x2="300" y2="405" stroke="#d62828" stroke-width="3"/>
  <text x="296" y="112" font-size="12" fill="#d62828" text-anchor="middle">3V3</text>
  <line x1="240" y1="160" x2="325" y2="160" stroke="#222" stroke-width="3"/>
  <line x1="325" y1="160" x2="325" y2="420" stroke="#222" stroke-width="3"/>
  <text x="335" y="152" font-size="12" fill="#222">GND</text>

  <!-- ===== Soil moisture sensor ===== -->
  <rect x="520" y="180" width="180" height="80" rx="8" fill="#e8f6f3" stroke="#2a9d8f" stroke-width="2"/>
  <text x="610" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b6b62">Soil Moisture</text>
  <text x="610" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b6b62">Sensor</text>
  <g font-size="11" fill="#444"><text x="526" y="204">VCC</text><text x="526" y="224"></text><text x="526" y="244">GND</text></g>
  <line x1="300" y1="200" x2="520" y2="200" stroke="#d62828" stroke-width="2"/>
  <line x1="240" y1="220" x2="520" y2="220" stroke="#2a9d8f" stroke-width="2.5"/>
  <line x1="325" y1="240" x2="520" y2="240" stroke="#222" stroke-width="2"/>
  <text x="480" y="215" font-size="11" fill="#2a9d8f" text-anchor="end">AOUT</text>
  <circle cx="300" cy="200" r="4" fill="#d62828"/><circle cx="325" cy="240" r="4" fill="#222"/>

  <!-- ===== DHT22 ===== -->
  <rect x="520" y="270" width="180" height="75" rx="8" fill="#fdf1e7" stroke="#f4a261" stroke-width="2"/>
  <text x="625" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#b5651d">DHT22</text>
  <g font-size="11" fill="#444"><text x="526" y="289">DATA</text><text x="526" y="319">VCC</text><text x="526" y="337">GND</text></g>
  <line x1="240" y1="285" x2="520" y2="285" stroke="#f4a261" stroke-width="2.5"/>
  <line x1="300" y1="315" x2="520" y2="315" stroke="#d62828" stroke-width="2"/>
  <line x1="325" y1="333" x2="520" y2="333" stroke="#222" stroke-width="2"/>
  <circle cx="300" cy="315" r="4" fill="#d62828"/><circle cx="325" cy="333" r="4" fill="#222"/>
  <!-- pull-up -->
  <circle cx="470" cy="285" r="3.5" fill="#444"/><circle cx="470" cy="315" r="3.5" fill="#444"/>
  <path d="M470 285 l0 3 l-5 2 l10 4 l-10 4 l10 4 l-10 4 l5 2 l0 7" fill="none" stroke="#444" stroke-width="1.8"/>
  <text x="460" y="304" font-size="11" fill="#444" text-anchor="end">10 kΩ</text>

  <!-- ===== OLED ===== -->
  <rect x="520" y="355" width="180" height="80" rx="8" fill="#f0ecf7" stroke="#6a4c93" stroke-width="2"/>
  <text x="625" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a3470">OLED SSD1306</text>
  <text x="625" y="410" text-anchor="middle" font-size="11" fill="#4a3470">128×64 · I²C 0x3C</text>
  <g font-size="11" fill="#444"><text x="526" y="374"></text></g>
  <line x1="240" y1="370" x2="520" y2="370" stroke="#6a4c93" stroke-width="2.5"/>
  <line x1="240" y1="390" x2="520" y2="390" stroke="#8e7dbe" stroke-width="2.5"/>
  <line x1="300" y1="405" x2="520" y2="405" stroke="#d62828" stroke-width="2"/>
  <line x1="325" y1="420" x2="520" y2="420" stroke="#222" stroke-width="2"/>
  <circle cx="300" cy="405" r="4" fill="#d62828"/><circle cx="325" cy="420" r="4" fill="#222"/>
  <g font-size="10" fill="#444" text-anchor="end">
    <text x="512" y="366">SDA</text><text x="512" y="386">SCL</text><text x="512" y="401">VCC</text><text x="512" y="416">GND</text>
  </g>

  <!-- ===== Status LED ===== -->
  <line x1="240" y1="470" x2="400" y2="470" stroke="#1d7fd6" stroke-width="2.5"/>
  <path d="M400 470 l5 0 l5 -6 l10 12 l10 -12 l10 12 l10 -12 l5 6 l5 0" fill="none" stroke="#444" stroke-width="1.8"/>
  <text x="430" y="456" font-size="11" fill="#444" text-anchor="middle">220 Ω</text>
  <line x1="460" y1="470" x2="500" y2="470" stroke="#1d7fd6" stroke-width="2"/>
  <path d="M500 458 L500 482 L522 470 Z" fill="#cfe5fb" stroke="#1d7fd6" stroke-width="2"/>
  <line x1="522" y1="458" x2="522" y2="482" stroke="#1d7fd6" stroke-width="2"/>
  <path d="M510 452 l8 -10 M518 452 l8 -10" stroke="#1d7fd6" stroke-width="1.5"/>
  <line x1="522" y1="470" x2="560" y2="470" stroke="#222" stroke-width="2"/>
  <line x1="560" y1="470" x2="560" y2="485" stroke="#222" stroke-width="2"/>
  <use href="#gnd" x="560" y="485"/>
  <text x="511" y="502" font-size="11" fill="#1d7fd6" text-anchor="middle">Status LED</text>

  <!-- ===== Pump driver ===== -->
  <line x1="240" y1="550" x2="420" y2="550" stroke="#e76f51" stroke-width="2.5"/>
  <path d="M420 550 l5 0 l5 -6 l10 12 l10 -12 l10 12 l10 -12 l5 6 l5 0" fill="none" stroke="#444" stroke-width="1.8"/>
  <text x="450" y="536" font-size="11" fill="#444" text-anchor="middle">1 kΩ</text>
  <line x1="480" y1="550" x2="600" y2="550" stroke="#e76f51" stroke-width="2"/>
  <!-- gate pull-down -->
  <circle cx="540" cy="550" r="3.5" fill="#444"/>
  <path d="M540 550 l0 8 l-5 2 l10 4 l-10 4 l10 4 l-10 4 l5 2 l0 12" fill="none" stroke="#444" stroke-width="1.8"/>
  <use href="#gnd" x="540" y="590"/>
  <text x="530" y="576" font-size="11" fill="#444" text-anchor="end">10 kΩ</text>

  <rect x="600" y="515" width="110" height="70" rx="6" fill="#fdeee9" stroke="#e76f51" stroke-width="2"/>
  <text x="655" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="#a3432a">N-MOSFET</text>
  <text x="655" y="562" text-anchor="middle" font-size="11" fill="#a3432a">logic-level</text>
  <g font-size="10" fill="#444"><text x="604" y="548">G</text><text x="660" y="528">D</text><text x="660" y="582">S</text></g>
  <line x1="655" y1="585" x2="655" y2="605" stroke="#222" stroke-width="2"/>
  <use href="#gnd" x="655" y="605"/>

  <!-- drain → pump(−) -->
  <line x1="655" y1="515" x2="655" y2="495" stroke="#555" stroke-width="2"/>
  <line x1="655" y1="495" x2="820" y2="495" stroke="#555" stroke-width="2"/>
  <line x1="820" y1="495" x2="820" y2="484" stroke="#555" stroke-width="2"/>
  <circle cx="760" cy="495" r="4" fill="#555"/>

  <!-- pump -->
  <circle cx="820" cy="460" r="24" fill="#e9f3fb" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="820" y="466" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a5f">M</text>
  <text x="852" y="458" font-size="11" fill="#1e3a5f">Pump</text>
  <text x="852" y="472" font-size="11" fill="#1e3a5f">5 V</text>
  <text x="826" y="432" font-size="11" fill="#444">+</text>
  <text x="826" y="494" font-size="11" fill="#444">−</text>

  <!-- pump(+) → +5V ext -->
  <line x1="820" y1="436" x2="820" y2="400" stroke="#c1121f" stroke-width="2.5"/>
  <line x1="760" y1="400" x2="900" y2="400" stroke="#c1121f" stroke-width="2.5"/>
  <circle cx="820" cy="400" r="4" fill="#c1121f"/>

  <!-- flyback diode (cathode up, to +5V) -->
  <line x1="760" y1="400" x2="760" y2="432" stroke="#555" stroke-width="2"/>
  <path d="M748 462 L772 462 L760 438 Z" fill="#eee" stroke="#222" stroke-width="2"/>
  <line x1="748" y1="436" x2="772" y2="436" stroke="#222" stroke-width="2.5"/>
  <line x1="760" y1="462" x2="760" y2="495" stroke="#555" stroke-width="2"/>
  <text x="742" y="446" font-size="11" fill="#444" text-anchor="end">Flyback</text>
  <text x="742" y="460" font-size="11" fill="#444" text-anchor="end">1N4007</text>

  <!-- external PSU -->
  <rect x="900" y="380" width="95" height="110" rx="8" fill="#fbe9ea" stroke="#c1121f" stroke-width="2"/>
  <text x="947" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a0f18">External</text>
  <text x="947" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a0f18">5 V supply</text>
  <text x="908" y="397" font-size="12" fill="#444">+</text>
  <text x="944" y="485" font-size="12" fill="#444">−</text>
  <line x1="947" y1="490" x2="947" y2="605" stroke="#222" stroke-width="2"/>
  <use href="#gnd" x="947" y="605"/>
  <text x="957" y="580" font-size="11" fill="#444">common</text>
  <text x="957" y="594" font-size="11" fill="#444">GND</text>

  <!-- ===== Notes ===== -->
  <g font-size="12" fill="#444">
    <text x="40" y="652">• All ground symbols are tied together (ESP32 GND and external supply GND).</text>
    <text x="40" y="670">• The pump is powered by its own 5 V supply, never from the ESP32 3V3 pin. Driver is active-HIGH (GPIO25 = HIGH → pump ON).</text>
    <text x="40" y="688">• Many DHT22 breakout modules already include the 10 kΩ pull-up. A relay module (active-HIGH) can replace the MOSFET stage.</text>
  </g>
</svg>
